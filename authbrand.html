<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brand Login — MerchMarket</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="merchmarket.css">
  <style>
    .login-container {
      background: rgba(20,20,20,.85);
      border: 1px solid rgba(170,111,2,.4);
      border-radius: 20px;
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 420px;
      backdrop-filter: blur(20px);
    }
    .logo-center { text-align: center; display: block; font-size: 1.8rem; margin-bottom: 2rem; }
    .title { font-family: 'Syne', sans-serif; font-size: 1.5rem; color: #ffd8b5; text-align: center; margin-bottom: .4rem; }
    .sub   { color: #a0a0a0; font-size: .9rem; text-align: center; margin-bottom: 2rem; }
    .login-form input {
      width: 100%;
      padding: .9rem 1.2rem;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(170,111,2,.4);
      border-radius: 10px;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      margin-bottom: 1.2rem;
      transition: border-color .2s;
    }
    .login-form input:focus { outline: none; border-color: #c47d2e; box-shadow: 0 0 0 3px rgba(196,125,46,.15); }
    .login-form input::placeholder { color: #555; }
    .forgot-password { display: block; text-align: right; color: #c47d2e; font-size: .85rem; margin-bottom: 1.2rem; text-decoration: none; }
    .login-button {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #c47d2e, #ffd8b5);
      color: #0a0a0a;
      border: none;
      border-radius: 12px;
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all .25s;
    }
    .login-button:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(196,125,46,.4); }
    .signup-text { text-align: center; margin-top: 1.5rem; color: #a0a0a0; font-size: .9rem; }
    .signup-text a { color: #c47d2e; text-decoration: none; font-weight: 600; }
    .back-link { display: block; text-align: center; margin-top: .8rem; color: #555; font-size: .85rem; text-decoration: none; }
    .back-link:hover { color: #a0a0a0; }
  </style>
</head>
<body class="auth-body body" data-user-type="brand">

  <div class="login-container">
    <a class="logo logo-center" href="index.html">MerchMarket</a>
    <h1 class="title">Brand Login</h1>
    <p class="sub">Sign in to manage your brand and products</p>

    <form class="login-form" id="brandLoginForm">
      <input type="email"    id="login-email"    placeholder="Brand email address" required autocomplete="email">
      <input type="password" id="login-password" placeholder="Password"              required autocomplete="current-password">
      <a href="#" class="forgot-password">FORGOT PASSWORD?</a>
      <button type="submit" class="login-button">LOG IN AS BRAND</button>
    </form>

    <p class="signup-text">Don't have a brand account? <a href="signupbrand.html">Sign up</a></p>
    <a href="signup.html" class="back-link">← Back to account type</a>
  </div>

   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="merchmarket.js"></script>
</body>
</html>
 
</body>
</html>
