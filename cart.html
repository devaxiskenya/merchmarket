<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart — MerchMarket</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="merchmarket.css">
  <link rel="stylesheet" href="cart.css">
</head>
<body class="body">

  <div id="nav-root"></div>

  <div class="page" id="page-cart">
    <main>
      <div class="cart-page-header">
        <h2 class="cart-page-title">Your Cart <span id="cart-title-count"></span></h2>
        <div class="cart-actions">
          <button class="btn-ghost" onclick="clearCart()" id="clear-btn" style="display:none;">Clear all</button>
          <a href="marketplace.html" class="btn-ghost">← Continue Shopping</a>
        </div>
      </div>

      <!-- Empty state -->
      <div class="cart-empty" id="cart-empty" style="display:none;">
        <div class="empty-icon">🛒</div>
        <p class="empty-msg">Your cart is empty</p>
        <a href="marketplace.html" class="btn-primary" style="display:inline-block;text-decoration:none;">Browse products</a>
      </div>

      <!-- Signed-out state -->
      <div class="cart-empty" id="cart-guest" style="display:none;">
        <div class="empty-icon">🔒</div>
        <p class="empty-msg">Sign in to check out your cart</p>
        <a href="login.html" class="btn-primary" style="display:inline-block;text-decoration:none;">Log In</a>
      </div>

      <!-- Cart contents -->
      <div class="cart-layout" id="cart-contents" style="display:none;">
        <div class="cart-items-col">
          <div class="cart-table-head">
            <span></span>
            <span>Item</span>
            <span>Qty</span>
            <span style="text-align:right;">Price</span>
            <span></span>
          </div>
          <div id="cart-items-list"></div>
        </div>

        <div class="summary-panel">
          <p class="summary-label">Order Summary</p>

          <div class="summary-line">
            <span>Subtotal</span>
            <span class="summary-val" id="s-subtotal">KES 0</span>
          </div>

          <hr class="summary-divider">

          <div class="summary-total">
            <span class="summary-total-label">Total</span>
            <span class="summary-total-val" id="s-total">KES 0</span>
          </div>

          <button class="checkout-btn" onclick="checkoutCart()">Proceed to Checkout →</button>
          <p class="save-note">No payment is taken on this site.</p>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="merchmarket.js"></script>
  <script src="cart.js"></script>
</body>
</html>
