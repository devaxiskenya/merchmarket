<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0d0d0d">
  <title>Courier — MerchMarket</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="merchmarket.css">
  <style>
    body { padding: 0; min-height: 100vh; }
    .c-wrap { max-width: 460px; margin: 0 auto; padding: 1.4rem 16px 3rem; }
    .c-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.4rem; }
    .c-logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.35rem;
      background: linear-gradient(135deg, #FFD8B5, #c47d2e); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .c-who { color: #a0a0a0; font-size: .82rem; text-align: right; }
    .c-who button { background: none; border: none; color: #c47d2e; font-weight: 600; cursor: pointer; padding: 0; font: inherit; font-size: .82rem; }
    .c-card { background: rgba(255,255,255,.04); border: 1px solid rgba(170,111,2,.3); border-radius: 16px; padding: 1.3rem; margin-bottom: 1rem; }
    .c-card h1, .c-card h2 { font-family: 'Syne', sans-serif; margin: 0 0 .4rem; color: #fff; }
    .c-card h1 { font-size: 1.4rem; }
    .c-card h2 { font-size: 1.05rem; }
    .c-card p { color: #a0a0a0; font-size: .9rem; margin: .2rem 0 1rem; }
    .c-field { display: flex; flex-direction: column; gap: .35rem; margin-bottom: .9rem; color: #a0a0a0; font-size: .82rem; }
    .c-field input { background: rgba(0,0,0,.35); border: 1px solid rgba(170,111,2,.35); border-radius: 10px; color: #fff;
      padding: .85rem .9rem; font: inherit; font-size: 1.05rem; letter-spacing: .04em; }
    .c-field input:focus { outline: 2px solid #c47d2e; outline-offset: 1px; }
    .c-check { display: flex; gap: .5rem; align-items: center; color: #bbb; font-size: .85rem; margin-bottom: 1rem; }
    .c-btn { width: 100%; padding: .95rem; font-size: 1rem; }
    .c-video { position: relative; border-radius: 14px; overflow: hidden; background: #000; aspect-ratio: 1; margin-bottom: .9rem; display: none; }
    .c-video.on { display: block; }
    .c-video video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .c-frame { position: absolute; inset: 16%; border: 3px solid rgba(255,216,181,.9); border-radius: 16px; box-shadow: 0 0 0 999px rgba(0,0,0,.35); }
    .c-or { text-align: center; color: #777; font-size: .82rem; margin: 1rem 0; }
    .c-result { display: none; border-radius: 16px; padding: 1.6rem 1.3rem; text-align: center; margin-bottom: 1rem; }
    .c-result.show { display: block; }
    .c-result.ok { background: rgba(76,175,80,.14); border: 1px solid rgba(76,175,80,.5); }
    .c-result.bad { background: rgba(244,67,54,.12); border: 1px solid rgba(244,67,54,.45); }
    .c-result .big { font-size: 2.6rem; line-height: 1; }
    .c-result h2 { font-family: 'Syne', sans-serif; color: #fff; margin: .6rem 0 .3rem; }
    .c-result p { color: #ddd; margin: 0 0 1rem; font-size: .92rem; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div class="c-wrap">
  <div class="c-top">
    <div class="c-logo">MerchMarket</div>
    <div class="c-who" id="who"></div>
  </div>

  <!-- Sign in -->
  <div class="c-card" id="signin">
    <h1>Courier sign-in</h1>
    <p>Enter the access code MerchMarket gave you.</p>
    <form id="signinForm">
      <label class="c-field">Access code
        <input id="accessCode" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX" required>
      </label>
      <label class="c-check"><input type="checkbox" id="remember" checked> Keep me signed in on this phone</label>
      <button class="btn btn-primary c-btn" type="submit">Sign in</button>
    </form>
  </div>

  <!-- Result -->
  <div class="c-result" id="result" role="status" aria-live="polite">
    <div class="big" id="resIcon"></div>
    <h2 id="resTitle"></h2>
    <p id="resText"></p>
    <button class="btn btn-primary c-btn" id="resNext">Next delivery</button>
  </div>

  <!-- Confirm -->
  <div id="confirm" class="hidden">
    <div class="c-card">
      <h2>Scan the buyer's QR code</h2>
      <p>Ask the buyer to open their order on MerchMarket and tap “Show delivery code”.</p>
      <div class="c-video" id="videoBox"><video id="video" playsinline muted></video><div class="c-frame"></div></div>
      <button class="btn btn-primary c-btn" id="scanBtn">Start camera</button>
    </div>

    <div class="c-or">or type the backup code</div>

    <div class="c-card">
      <form id="manualForm">
        <label class="c-field">Order reference
          <input id="orderRef" autocomplete="off" spellcheck="false" placeholder="e.g. 3f9a1c2b" required>
        </label>
        <label class="c-field">6-digit backup code
          <input id="shortCode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off" placeholder="123456" required>
        </label>
        <button class="btn btn-primary c-btn" type="submit">Confirm delivery</button>
      </form>
    </div>
  </div>
</div>

<script src="vendor/jsQR.min.js"></script>
<script>
(function () {
  const KEY = 'mm_courier_code';
  let code = '';
  let stream = null;
  let scanning = false;
  let sending = false;

  const $ = id => document.getElementById(id);
  const store = {
    get() { try { return localStorage.getItem(KEY) || sessionStorage.getItem(KEY) || ''; } catch (e) { return ''; } },
    set(v, remember) {
      try { (remember ? localStorage : sessionStorage).setItem(KEY, v); } catch (e) {}
    },
    clear() { try { localStorage.removeItem(KEY); sessionStorage.removeItem(KEY); } catch (e) {} }
  };

  async function call(path, body) {
    const res = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-courier-code': code },
      body: JSON.stringify(body || {})
    });
    return { ok: res.ok, status: res.status, data: await res.json().catch(() => ({})) };
  }

  function showSignedIn(name) {
    $('signin').classList.add('hidden');
    $('confirm').classList.remove('hidden');
    $('who').innerHTML = '';
    const span = document.createElement('div');
    span.textContent = name;
    const out = document.createElement('button');
    out.type = 'button';
    out.textContent = 'Sign out';
    out.addEventListener('click', signOut);
    $('who').append(span, out);
  }

  function signOut() {
    stopCamera();
    store.clear();
    code = '';
    $('who').innerHTML = '';
    $('confirm').classList.add('hidden');
    $('result').classList.remove('show');
    $('signin').classList.remove('hidden');
    $('accessCode').value = '';
  }

  async function signIn(raw, remember, silent) {
    code = raw.trim().toUpperCase();
    const r = await call('/api/courier/session');
    if (!r.ok) {
      code = '';
      store.clear();
      if (!silent) alert(r.data.error || 'That access code did not work.');
      return;
    }
    store.set(code, remember);
    showSignedIn(r.data.name);
  }

  function showResult(ok, title, text) {
    stopCamera();
    $('resIcon').textContent = ok ? '✅' : '⚠️';
    $('resTitle').textContent = title;
    $('resText').textContent = text;
    $('result').className = 'c-result show ' + (ok ? 'ok' : 'bad');
    $('confirm').classList.add('hidden');
    if (navigator.vibrate) navigator.vibrate(ok ? 120 : [80, 60, 80]);
    $('resNext').focus();
  }

  async function confirmDelivery(body) {
    if (sending) return;
    sending = true;
    try {
      const r = await call('/api/courier/confirm-delivery', body);
      if (r.status === 401) { signOut(); alert('Your access code is no longer valid. Ask MerchMarket for a new one.'); return; }
      if (r.ok) {
        showResult(true, 'Delivery confirmed', 'Order #' + String(r.data.order_id).slice(0, 8) + ' is marked as delivered. The buyer has been notified.');
        $('manualForm').reset();
      } else {
        showResult(false, 'Not confirmed', r.data.error || 'Could not confirm this delivery.');
      }
    } catch (e) {
      showResult(false, 'No connection', 'Check your internet connection and try again.');
    } finally {
      sending = false;
    }
  }

  // ── Camera scanning ─────────────────────────────────────
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  let detector = null;
  try {
    if ('BarcodeDetector' in window) detector = new BarcodeDetector({ formats: ['qr_code'] });
  } catch (e) { detector = null; }

  async function startCamera() {
    if (!navigator.mediaDevices?.getUserMedia) {
      alert('This browser can’t use the camera. Type the backup code instead.');
      return;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
    } catch (e) {
      alert('Camera permission was blocked. Allow camera access for this site, or type the backup code instead.');
      return;
    }
    const video = $('video');
    video.srcObject = stream;
    await video.play().catch(() => {});
    $('videoBox').classList.add('on');
    $('scanBtn').textContent = 'Stop camera';
    scanning = true;
    tick();
  }

  function stopCamera() {
    scanning = false;
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null;
    $('videoBox').classList.remove('on');
    $('scanBtn').textContent = 'Start camera';
  }

  async function readFrame(video) {
    if (detector) {
      try {
        const codes = await detector.detect(video);
        if (codes.length) return codes[0].rawValue;
      } catch (e) { detector = null; }
    }
    if (typeof jsQR !== 'function') return null;
    const w = video.videoWidth, h = video.videoHeight;
    if (!w || !h) return null;
    const scale = Math.min(1, 640 / Math.max(w, h));
    canvas.width = Math.round(w * scale);
    canvas.height = Math.round(h * scale);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const found = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
    return found ? found.data : null;
  }

  async function tick() {
    if (!scanning) return;
    const video = $('video');
    if (video.readyState >= 2) {
      const value = await readFrame(video);
      if (value && /^[0-9a-f]{64}$/i.test(value.trim())) {
        stopCamera();
        confirmDelivery({ token: value.trim() });
        return;
      }
    }
    setTimeout(tick, 200);
  }

  // ── Wiring ──────────────────────────────────────────────
  $('signinForm').addEventListener('submit', e => {
    e.preventDefault();
    signIn($('accessCode').value, $('remember').checked, false);
  });
  $('scanBtn').addEventListener('click', () => (scanning ? stopCamera() : startCamera()));
  $('manualForm').addEventListener('submit', e => {
    e.preventDefault();
    const ref = $('orderRef').value.trim().replace(/^#/, '');
    const short = $('shortCode').value.trim();
    if (!/^\d{6}$/.test(short)) { alert('The backup code is 6 digits.'); return; }
    confirmDelivery({ order_id: ref, short_code: short });
  });
  $('resNext').addEventListener('click', () => {
    $('result').classList.remove('show');
    $('confirm').classList.remove('hidden');
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) stopCamera(); });

  const saved = store.get();
  if (saved) signIn(saved, !!(function () { try { return localStorage.getItem(KEY); } catch (e) { return null; } })(), true);
})();
</script>
</body>
</html>
