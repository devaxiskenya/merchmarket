<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Vendor Review — MerchMarket Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="merchmarket.css">
  <style>
    body { padding-top: 0; }
    .admin-page { max-width: 1000px; margin: 0 auto; padding: 2rem; }
    .admin-page h1 { font-family: 'Syne', sans-serif; font-size: 1.6rem; margin-bottom: .4rem; }
    .admin-sub { color: #999; font-size: .9rem; margin-bottom: 1.5rem; }
    .v-card {
      border: 1px solid var(--border-brand); border-radius: 12px; padding: 1.1rem 1.2rem;
      margin-bottom: 1rem; background: rgba(255,255,255,.03);
    }
    .v-head { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; align-items: baseline; }
    .v-name { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.05rem; }
    .v-email { color: #999; font-size: .85rem; }
    .v-pill {
      display: inline-block; padding: .2rem .65rem; border-radius: 999px; font-size: .72rem;
      font-weight: 700; background: rgba(255,255,255,.08); color: #ccc; margin-left: .4rem;
    }
    .v-pill.ok { background: rgba(46,204,113,.15); color: #2ecc71; }
    .v-pill.warn { background: rgba(196,125,46,.2); color: #e0a45f; }
    .v-pill.bad { background: rgba(244,67,54,.15); color: #f44336; }
    .v-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: .4rem 1.2rem; margin: .9rem 0; font-size: .85rem; }
    .v-grid span { color: #888; display: block; font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; }
    .v-actions { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }
    .v-actions select { padding: .5rem .7rem; border-radius: 8px; border: 1px solid var(--border-brand); background: rgba(255,255,255,.05); color: #fff; }
    .v-actions select option { color: #111; }
    .v-note { color: #e0a45f; font-size: .8rem; margin-top: .6rem; }
    #adminMsg { color: #999; padding: 2rem 0; }
  </style>
</head>
<body>
<div class="admin-page">
  <h1>Vendor review</h1>
  <p class="admin-sub">Vendor details lock 42 hours after signup. Reopen a vendor here so they can correct them; the reason is kept for the audit trail.</p>
  <div id="adminMsg">Loading…</div>
  <div id="vendorList"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="merchmarket.js"></script>
<script>
(function () {
  const list = document.getElementById('vendorList');
  const msg = document.getElementById('adminMsg');

  const fmt = iso => iso ? new Date(iso).toLocaleString() : '—';

  function el(tag, props = {}, ...kids) {
    const n = document.createElement(tag);
    Object.assign(n, props);
    kids.forEach(k => n.append(k));
    return n;
  }

  function field(label, value) {
    return el('div', {}, el('span', { textContent: label }), document.createTextNode(value || '—'));
  }

  async function api(path, method = 'GET', body) {
    const res = await fetch(path, {
      method,
      headers: { 'Content-Type': 'application/json', ...(await getAuthHeader()) },
      body: body ? JSON.stringify(body) : undefined
    });
    const payload = await res.json().catch(() => ({}));
    return { ok: res.ok, status: res.status, payload };
  }

  function card(v) {
    const lockPill = v.reopened ? el('span', { className: 'v-pill warn', textContent: 'Reopened until ' + fmt(v.reopened_until) })
      : v.editable ? el('span', { className: 'v-pill ok', textContent: 'Editable until ' + fmt(v.lock_at) })
      : el('span', { className: 'v-pill bad', textContent: 'Locked' });
    const statusPill = el('span', { className: 'v-pill', textContent: v.status });

    const hours = el('select');
    [[24, '24 hours'], [48, '48 hours'], [72, '72 hours']].forEach(([h, t]) => hours.append(new Option(t, h)));

    const reopenBtn = el('button', { className: 'btn btn-primary', textContent: 'Reopen for edits' });
    reopenBtn.addEventListener('click', async () => {
      const reason = (prompt('Why is this vendor being reopened? (kept in the audit trail)') || '').trim();
      if (!reason) return;
      reopenBtn.disabled = true;
      const r = await api(`/api/admin/vendors/${v.brand_id}/reopen`, 'POST', { hours: Number(hours.value), reason });
      if (!r.ok) { showToast(r.payload.error || 'Failed to reopen.', 'error'); reopenBtn.disabled = false; return; }
      showToast('Vendor reopened.', 'success');
      load();
    });

    const actions = el('div', { className: 'v-actions' }, hours, reopenBtn);
    if (v.reopened) {
      const lockBtn = el('button', { className: 'btn btn-secondary', textContent: 'Lock now' });
      lockBtn.addEventListener('click', async () => {
        lockBtn.disabled = true;
        const r = await api(`/api/admin/vendors/${v.brand_id}/lock`, 'POST');
        if (!r.ok) { showToast(r.payload.error || 'Failed to lock.', 'error'); lockBtn.disabled = false; return; }
        showToast('Vendor locked.', 'success');
        load();
      });
      actions.append(lockBtn);
    }

    const c = el('div', { className: 'v-card' },
      el('div', { className: 'v-head' },
        el('div', {}, el('span', { className: 'v-name', textContent: v.name || '(no name)' }), statusPill, lockPill),
        el('div', { className: 'v-email', textContent: v.email || '' })
      ),
      el('div', { className: 'v-grid' },
        field('Business type', v.business_type),
        field('KRA PIN', v.kra_pin),
        field('Category', v.product_category),
        field('Contact', [v.contact_person, v.phone].filter(Boolean).join(' · ')),
        field('Payout', [v.payout_method, v.payout_bank_name, v.payout_account_number].filter(Boolean).join(' · ')),
        field('Account name', v.payout_account_name),
        field('Signed up', fmt(v.created_at)),
        field('Agreement', v.agreement_version ? `${v.agreement_version} (${fmt(v.agreement_accepted_at)})` : '')
      ),
      actions
    );
    if (v.reopened_by) {
      c.append(el('div', { className: 'v-note', textContent: `Last reopened by ${v.reopened_by} on ${fmt(v.reopened_at)}: ${v.reopen_reason || ''}` }));
    }
    return c;
  }

  async function load() {
    const r = await api('/api/admin/vendors');
    if (r.status === 401) { msg.textContent = 'Please sign in with an admin account first.'; return; }
    if (r.status === 403) { msg.textContent = 'This page is for MerchMarket admins only.'; return; }
    if (!r.ok) { msg.textContent = r.payload.error || 'Failed to load vendors.'; return; }
    msg.textContent = r.payload.vendors.length ? '' : 'No vendors yet.';
    list.replaceChildren(...r.payload.vendors.map(card));
  }

  load();
})();
</script>
</body>
</html>
