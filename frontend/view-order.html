<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Details — MerchMarket</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="merchmarket.css">
  <style>
    .order-page { max-width: 720px; margin: 0 auto; }
    .order-panel {
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(170,111,2,.3);
      border-radius: 16px;
      padding: 2rem 2.2rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }
    .order-block {
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(170,111,2,.18);
      border-radius: 12px;
      padding: 1.2rem 1.4rem;
    }
    .order-block h4 { margin: 0 0 .6rem 0; color: var(--accent-light); font-family: 'Syne', sans-serif; }
    .order-block p { color: #ddd; font-size: .92rem; margin: .2rem 0; }
    .order-block ul { padding-left: 1.2rem; color: #ddd; font-size: .92rem; }
    .order-total-row {
      display: flex; justify-content: space-between; align-items: center;
    }
    .order-total-row .total-value { font-size: 1.3rem; font-weight: 700; color: var(--accent-light); font-family: 'Syne', sans-serif; }
    .order-actions { display: flex; gap: 1rem; justify-content: flex-end; flex-wrap: wrap; margin-top: .5rem; }
    .order-actions .btn { min-width: 140px; }
    .stage-form { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; margin-top: .4rem; }
    .stage-form label { display: flex; flex-direction: column; gap: .3rem; font-size: .8rem; color: #a0a0a0; }
    .stage-form label.full { grid-column: 1 / -1; }
    .stage-form input, .stage-form textarea {
      background: rgba(0,0,0,.35); border: 1px solid rgba(170,111,2,.3); border-radius: 8px;
      color: #fff; padding: .6rem .7rem; font: inherit; font-size: .9rem;
    }
    .stage-form textarea { min-height: 64px; resize: vertical; }
    .stage-hint { color: #a0a0a0; font-size: .85rem; margin: .2rem 0 0; }
    .history { list-style: none; margin: 0; padding: 0; }
    .history li { position: relative; padding: 0 0 .9rem 1.4rem; color: #ddd; font-size: .9rem; }
    .history li::before { content: ''; position: absolute; left: 4px; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: #c47d2e; }
    .history li::after { content: ''; position: absolute; left: 7px; top: 16px; bottom: 0; width: 2px; background: rgba(255,255,255,.1); }
    .history li:last-child::after { display: none; }
    .history .when { color: #8a8a8a; font-size: .78rem; }
    .history .note { color: #bbb; font-size: .82rem; margin-top: .15rem; }
    .btn-danger { background: transparent !important; border: 1px solid rgba(244,67,54,.5) !important; color: #ef9a9a !important; }
    .order-panel > .order-block + .order-block { margin-top: 1rem; }
    @media (max-width: 768px) { .order-page { padding-top: 10rem !important; } }
    @media (max-width: 600px) {
      .order-panel { padding: 1.2rem; }
      .stage-form { grid-template-columns: 1fr; }
      .order-actions { justify-content: stretch; }
      .order-actions .btn { flex: 1; }
    }
  </style>
</head>
<body class="admin-body">

<nav class="admin-navbar">
  <div class="logo" onclick="location.href='index.html'">
    MerchMarket
    <span style="font-size:.9rem;font-weight:400;opacity:.7;">Brand Admin</span>
  </div>
  <ul class="admin-nav-links">
    <li><a href="brandflow.html?tab=orders" style="color:#a0a0a0;font-size:.85rem;padding:1rem;">← Back to Orders</a></li>
    <li><a href="#" data-auth-link="logout" style="color:#f44336;font-size:.85rem;padding:1rem;font-weight:600;">Sign Out</a></li>
  </ul>
</nav>

<main class="admin-main order-page" style="padding-top:7rem;">
  <div class="module-header">
    <h1 id="orderTitle">Order</h1>
  </div>

  <div id="guardMsg" style="display:none;color:#a0a0a0;padding:3rem;text-align:center;">
    Please <a href="login.html?type=brand" style="color:#c47d2e;font-weight:600;">log in as a brand</a> to view orders.
  </div>

  <div class="order-panel" id="orderPanel" style="display:none;"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="merchmarket.js"></script>

<script>
  const params  = new URLSearchParams(location.search);
  const orderId = params.get('id');

  function esc(s) {
    if (typeof window.escapeHtml === 'function') return window.escapeHtml(s ?? '—');
    return String(s ?? '—');
  }

  async function loadOrder() {
    const panel = document.getElementById('orderPanel');
    panel.style.display = 'block';

    if (!orderId) {
      panel.innerHTML = '<p style="color:#a0a0a0;">No order specified.</p>';
      return;
    }

    const headers = await getAuthHeader();
    const res = await fetch(`/api/brand/orders/${encodeURIComponent(orderId)}`, { headers });
    const payload = await res.json().catch(() => ({}));
    const order = payload.order;

    if (!res.ok || !order) {
      panel.innerHTML = '<p style="color:#a0a0a0;">Order not found.</p>';
      return;
    }

    const cust  = order.profiles || {};
    const items = order.order_items || [];
    const date  = order.created_at ? new Date(order.created_at).toLocaleDateString('en-KE') : '—';
    const total = parseFloat(order.total_amount) || 0;
    const st    = order.status || 'pending';
    const paid  = order.payment_status === 'paid';
    const hist  = order.order_status_history || [];

    const itemsHtml = items.length
      ? items.map(i => `<li>${esc(i.products?.name || i.sku)}${i.size ? ' (' + esc(i.size) + ')' : ''} — Qty: ${Number(i.quantity) || 0} — KES ${parseFloat(i.unit_price || 0).toLocaleString()}</li>`).join('')
      : '<li>No items</li>';

    const fmt = d => d ? new Date(d).toLocaleString('en-KE', { dateStyle: 'medium', timeStyle: 'short' }) : '';
    const histHtml = hist.length
      ? hist.map(h => `<li><strong>${esc(STAGE_LABEL[h.to_status] || h.to_status)}</strong>
          <div class="when">${esc(fmt(h.created_at))}${h.actor_role === 'system' || h.actor_role === 'service_role' ? ' · system' : ''}</div>
          ${h.note ? `<div class="note">${esc(h.note)}</div>` : ''}</li>`).join('')
      : '<li>No history yet.</li>';

    const trackingHtml = (order.tracking_number || order.carrier)
      ? `<p><strong>Carrier:</strong> ${esc(order.carrier || '—')}</p><p><strong>Tracking no.:</strong> ${esc(order.tracking_number || '—')}</p>`
      : '';

    document.getElementById('orderTitle').textContent = `Order #${String(order.id).slice(0, 8)}`;

    panel.innerHTML = `
      <div class="order-block order-total-row">
        <p style="margin:0;"><strong>Status:</strong> <span class="status ${esc(st)}">${esc((STAGE_LABEL[st] || st).toUpperCase())}</span>
          <span class="status ${paid ? 'confirmed' : 'pending'}" style="margin-left:.4rem;">${paid ? 'PAID' : 'UNPAID'}</span></p>
        <div class="total-value">KES ${total.toLocaleString()}</div>
      </div>
      ${stageControls(order)}
      <div class="order-block">
        <h4>👤 Customer</h4>
        <p><strong>Name:</strong> ${esc(cust.name)}</p>
        <p><strong>Email:</strong> ${esc(cust.email)}</p>
      </div>
      <div class="order-block">
        <h4>📦 Items</h4>
        <ul>${itemsHtml}</ul>
      </div>
      <div class="order-block">
        <h4>📍 Shipping</h4>
        <p><strong>Location:</strong> ${esc(order.location || 'Nairobi, Kenya')}</p>
        <p><strong>Ordered:</strong> ${esc(date)}</p>
        ${trackingHtml}
      </div>
      <div class="order-block">
        <h4>🕒 History</h4>
        <ul class="history">${histHtml}</ul>
      </div>
    `;
  }

  const STAGE_LABEL = {
    pending: 'Placed', confirmed: 'Confirmed', active: 'Being prepared',
    shipped: 'Shipped', completed: 'Delivered', cancelled: 'Cancelled'
  };

  // Only the moves the database allows a brand to make.
  const NEXT = {
    pending:   ['confirmed'],
    confirmed: ['active', 'shipped'],
    active:    ['shipped']
  };
  const ACTION_LABEL = { confirmed: 'Confirm order', active: 'Start preparing', shipped: 'Mark as shipped' };

  function stageControls(order) {
    const st = order.status || 'pending';
    const paid = order.payment_status === 'paid';
    if (st === 'shipped') {
      return `<div class="order-block"><h4>🚚 Out for delivery</h4>
        <p class="stage-hint">Delivery is confirmed when the courier scans the buyer's QR code. You can't mark it delivered yourself.</p></div>`;
    }
    if (st === 'completed' || st === 'cancelled') return '';
    if (!paid) {
      return `<div class="order-block"><h4>⏳ Waiting for payment</h4>
        <p class="stage-hint">You can start on this order once the buyer has paid.</p></div>`;
    }
    const moves = NEXT[st] || [];
    const canShip = moves.includes('shipped');
    return `<div class="order-block" id="stageBlock">
      <h4>➡️ Next step</h4>
      <div class="stage-form">
        ${canShip ? `
        <label>Carrier<input id="carrierIn" maxlength="80" placeholder="e.g. G4S, Sendy, own rider" value="${escAttr(order.carrier)}"></label>
        <label>Tracking number<input id="trackingIn" maxlength="80" placeholder="Optional" value="${escAttr(order.tracking_number)}"></label>` : ''}
        <label class="full">Note to the buyer (optional)<textarea id="noteIn" maxlength="300" placeholder="Shown on the buyer's tracking page"></textarea></label>
      </div>
      <div class="order-actions">
        <button class="btn btn-danger" onclick="cancelOrder()">Cancel order</button>
        ${moves.map(m => `<button class="btn btn-primary" onclick="updateStatus('${m}')">${ACTION_LABEL[m]}</button>`).join('')}
      </div>
    </div>`;
  }

  function escAttr(v) {
    if (v == null) return '';
    if (typeof window.escapeAttribute === 'function') return window.escapeAttribute(v);
    return String(v).replace(/[&"<>']/g, c => ({ '&': '&amp;', '"': '&quot;', '<': '&lt;', '>': '&gt;', "'": '&#39;' }[c]));
  }

  function cancelOrder() {
    if (!confirm('Cancel this order? The buyer will be notified. This cannot be undone.')) return;
    updateStatus('cancelled');
  }

  let busy = false;
  async function updateStatus(newStatus) {
    if (busy) return;
    const val = id => (document.getElementById(id)?.value || '').trim();
    const body = { status: newStatus };
    if (val('noteIn')) body.note = val('noteIn');
    if (newStatus === 'shipped') {
      if (!val('carrierIn')) { showToast('Enter the carrier before marking as shipped', 'error'); return; }
      body.carrier = val('carrierIn');
      if (val('trackingIn')) body.tracking_number = val('trackingIn');
    }
    busy = true;
    document.querySelectorAll('#stageBlock button').forEach(b => { b.disabled = true; });
    try {
      const res = await fetch(`/api/brand/orders/${encodeURIComponent(orderId)}/status`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', ...(await getAuthHeader()) },
        body: JSON.stringify(body)
      });
      const payload = await res.json().catch(() => ({}));
      if (!res.ok) {
        showToast(payload.error || 'Failed to update order status', 'error');
        return;
      }
      showToast(`Order ${(STAGE_LABEL[newStatus] || newStatus).toLowerCase()}`, 'success');
      await loadOrder();
    } finally {
      busy = false;
      document.querySelectorAll('#stageBlock button').forEach(b => { b.disabled = false; });
    }
  }

  // Page guard + boot
  (async () => {
    const brand = await getBrandUser();
    if (!brand) {
      document.getElementById('guardMsg').style.display = 'block';
      setTimeout(() => { window.location.href = 'login.html?type=brand'; }, 900);
      return;
    }
    await loadOrder();
  })();
</script>

</body>
</html>
