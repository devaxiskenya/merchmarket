<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Sign Up — MerchMarket</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="merchmarket.css">
  <style>
    .login-container {
      background: rgba(20,20,20,.85);
      border: 1px solid rgba(170,111,2,.4);
      border-radius: 20px;
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 440px;
      backdrop-filter: blur(20px);
    }
    .logo-center { text-align: center; display: block; font-size: 1.8rem; margin-bottom: 1.5rem; }
    .title { font-family: 'Syne', sans-serif; font-size: 1.5rem; color: #ffd8b5; text-align: center; margin-bottom: .4rem; }
    .sub   { color: #a0a0a0; font-size: .9rem; text-align: center; margin-bottom: 2rem; }
    .login-form input {
      width: 100%;
      padding: .9rem 1.2rem;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(170,111,2,.4);
      border-radius: 10px;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      margin-bottom: 1.2rem;
      transition: border-color .2s;
    }
    .login-form input:focus { outline: none; border-color: #c47d2e; box-shadow: 0 0 0 3px rgba(196,125,46,.15); }
    .login-form input::placeholder { color: #555; }
    .signup-button {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #c47d2e, #ffd8b5);
      color: #0a0a0a;
      border: none;
      border-radius: 12px;
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all .25s;
      margin-top: .4rem;
    }
    .signup-button:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(196,125,46,.4); }
    .login-text { text-align: center; margin-top: 1.5rem; color: #a0a0a0; font-size: .9rem; }
    .login-text a { color: #c47d2e; text-decoration: none; font-weight: 600; }
    .error-msg { color: #f44336; font-size: .82rem; margin-top: -.8rem; margin-bottom: .8rem; display: none; }
  </style>
</head>
<body class="auth-body body" data-user-type="member">

  <div class="login-container">
    <a class="logo logo-center" href="index.html">MerchMarket</a>
    <h1 class="title">Member Sign Up</h1>
    <p class="sub">Create your free account to start shopping</p>

    <form class="signup-form" id="memberSignupForm">
      <input type="text"     id="fullName"        name="fullName"        placeholder="Full Name"           required>
      <input type="email"    id="email"            name="email"           placeholder="Email Address"       required>
      <!-- Fixed: was "equired" (missing r) -->
      <input type="password" id="password"         name="password"        placeholder="Password (min 8 chars)" required minlength="8">
      <input type="password" id="confirmPassword"  name="confirmPassword" placeholder="Confirm Password"   required minlength="8">
      <p class="error-msg" id="signupError"></p>
      <button type="submit" class="signup-button">CREATE ACCOUNT</button>
    </form>

    <p class="login-text">Already have an account? <a href="authmember.html">Log in</a></p>
  </div>

  <script src="merchmarket.js"></script>
  <script>
    document.getElementById('memberSignupForm').addEventListener('submit', e => {
      e.preventDefault();
      const name     = document.getElementById('fullName').value.trim();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirm  = document.getElementById('confirmPassword').value;
      const errEl    = document.getElementById('signupError');

      if (password !== confirm) {
        errEl.textContent = 'Passwords do not match.';
        errEl.style.display = 'block';
        return;
      }
      errEl.style.display = 'none';

      const user = createAccount('member', name, email, password);
      if (user) setTimeout(() => { window.location.href = 'authmember.html'; }, 1200);
    });
  </script>
</body>
</html>
