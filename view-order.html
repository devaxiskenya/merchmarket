<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Details — MerchMarket</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="merchmarket.css">
  <style>
    .order-page { max-width: 720px; margin: 0 auto; }
    .order-panel {
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(170,111,2,.3);
      border-radius: 16px;
      padding: 2rem 2.2rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }
    .order-block {
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(170,111,2,.18);
      border-radius: 12px;
      padding: 1.2rem 1.4rem;
    }
    .order-block h4 { margin: 0 0 .6rem 0; color: var(--accent-light); font-family: 'Syne', sans-serif; }
    .order-block p { color: #ddd; font-size: .92rem; margin: .2rem 0; }
    .order-block ul { padding-left: 1.2rem; color: #ddd; font-size: .92rem; }
    .order-total-row {
      display: flex; justify-content: space-between; align-items: center;
    }
    .order-total-row .total-value { font-size: 1.3rem; font-weight: 700; color: var(--accent-light); font-family: 'Syne', sans-serif; }
    .order-actions { display: flex; gap: 1rem; justify-content: flex-end; flex-wrap: wrap; margin-top: .5rem; }
    .order-actions .btn { min-width: 140px; }
  </style>
</head>
<body class="admin-body">

<nav class="admin-navbar">
  <div class="logo" onclick="location.href='index.html'">
    MerchMarket
    <span style="font-size:.9rem;font-weight:400;opacity:.7;">Brand Admin</span>
  </div>
  <ul class="admin-nav-links">
    <li><a href="brandflow.html?tab=orders" style="color:#a0a0a0;font-size:.85rem;padding:1rem;">← Back to Orders</a></li>
    <li><a href="#" data-auth-link="logout" style="color:#f44336;font-size:.85rem;padding:1rem;font-weight:600;">Sign Out</a></li>
  </ul>
</nav>

<main class="admin-main order-page" style="padding-top:6rem;">
  <div class="module-header">
    <h1 id="orderTitle">Order</h1>
  </div>

  <div id="guardMsg" style="display:none;color:#a0a0a0;padding:3rem;text-align:center;">
    Please <a href="login.html?type=brand" style="color:#c47d2e;font-weight:600;">log in as a brand</a> to view orders.
  </div>

  <div class="order-panel" id="orderPanel" style="display:none;"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="merchmarket.js"></script>

<script>
  const params  = new URLSearchParams(location.search);
  const orderId = params.get('id');

  function esc(s) { return (s ?? '—'); }

  async function loadOrder() {
    const panel = document.getElementById('orderPanel');
    panel.style.display = 'block';

    if (!orderId) {
      panel.innerHTML = '<p style="color:#a0a0a0;">No order specified.</p>';
      return;
    }

    const { data: order, error } = await db
      .from('orders')
      .select(`
        id, total_amount, status, location, created_at,
        profiles!orders_user_id_fkey (name, email),
        order_items ( quantity, sku, unit_price, products (name) )
      `)
      .eq('id', orderId)
      .single();

    if (error || !order) {
      panel.innerHTML = '<p style="color:#a0a0a0;">Order not found.</p>';
      return;
    }

    const cust  = order.profiles || {};
    const items = order.order_items || [];
    const date  = order.created_at ? new Date(order.created_at).toLocaleDateString('en-KE') : '—';
    const total = parseFloat(order.total_amount) || 0;
    const st    = order.status || 'pending';

    const itemsHtml = items.length
      ? items.map(i => `<li>${esc(i.products?.name || i.sku)} — Qty: ${i.quantity} — KES ${parseFloat(i.unit_price || 0).toLocaleString()}</li>`).join('')
      : '<li>No items</li>';

    document.getElementById('orderTitle').textContent = `Order #${order.id}`;

    panel.innerHTML = `
      <div class="order-block">
        <h4>👤 Customer</h4>
        <p><strong>Name:</strong> ${esc(cust.name)}</p>
        <p><strong>Email:</strong> ${esc(cust.email)}</p>
      </div>
      <div class="order-block">
        <h4>📦 Items</h4>
        <ul>${itemsHtml}</ul>
      </div>
      <div class="order-block">
        <h4>📍 Shipping</h4>
        <p><strong>Location:</strong> ${order.location || 'Nairobi, Kenya'}</p>
        <p><strong>Date:</strong> ${date}</p>
      </div>
      <div class="order-block order-total-row">
        <p style="margin:0;"><strong>Status:</strong> <span class="status ${st}">${st.toUpperCase()}</span></p>
        <div class="total-value">KES ${total.toLocaleString()}</div>
      </div>
      <div class="order-actions">
        ${st === 'pending'   ? `<button class="btn btn-primary" style="background:#4caf50;" onclick="updateStatus('confirmed')">Confirm</button>` : ''}
        ${st === 'confirmed' ? `<button class="btn btn-primary" style="background:#2196f3;" onclick="updateStatus('active')">Mark Shipped</button>` : ''}
        ${(st === 'active' || st === 'confirmed') ? `<button class="btn btn-primary" style="background:#ff9800;" onclick="updateStatus('completed')">Mark Completed</button>` : ''}
      </div>
    `;
  }

  async function updateStatus(newStatus) {
    const { error } = await db.from('orders').update({ status: newStatus }).eq('id', orderId);
    if (error) {
      console.error('updateOrderStatus error:', error.message);
      showToast('Failed to update order status', 'error');
      return;
    }
    showToast(`Order marked as ${newStatus}`, 'success');
    loadOrder();
  }

  // Page guard + boot
  (async () => {
    const brand = await getBrandUser();
    if (!brand) {
      document.getElementById('guardMsg').style.display = 'block';
      setTimeout(() => { window.location.href = 'login.html?type=brand'; }, 900);
      return;
    }
    await loadOrder();
  })();
</script>

</body>
</html>
