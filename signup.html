<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — MerchMarket</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="merchmarket.css">
  <style>
    .login-container {
      background: rgba(20,20,20,.85);
      border: 1px solid rgba(170,111,2,.4);
      border-radius: 20px;
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 440px;
      backdrop-filter: blur(20px);
      text-align: center;
    }
    .logo { display: block; font-size: 2rem; margin-bottom: 2rem; }
    .title {
      font-family: 'Syne', sans-serif;
      font-size: 1.6rem;
      color: #ffd8b5;
      margin-bottom: .5rem;
    }
    .sub { color: #a0a0a0; font-size: .95rem; margin-bottom: 2.5rem; }
    .account-container { margin-bottom: 1rem; }
    .account-button {
      width: 100%;
      padding: 1.3rem 2rem;
      border: 2px solid rgba(170,111,2,.35);
      border-radius: 14px;
      background: rgba(255,255,255,.04);
      color: #ffd8b5;
      font-family: 'Syne', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all .25s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }
    .account-button:hover {
      background: rgba(196,125,46,.18);
      border-color: #c47d2e;
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(196,125,46,.25);
    }
    .already { margin-top: 2rem; color: #a0a0a0; font-size: .9rem; }
    .already a { color: #c47d2e; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body class="auth-body body">

  <div class="login-container">
    <a class="logo" href="index.html">MerchMarket</a>
    <h1 class="title">Create an Account</h1>
    <p class="sub">Choose how you want to use MerchMarket</p>

    <div class="account-container">
      <button class="account-button" onclick="window.location.href='authmember.html'">
        <span>👤</span> I'm a Member <span style="font-size:.85rem;font-weight:400;opacity:.7;">— Browse &amp; buy merch</span>
      </button>
    </div>

    <div class="account-container">
      <button class="account-button" onclick="window.location.href='authbrand.html'">
        <span>🏷️</span> I'm a Brand <span style="font-size:.85rem;font-weight:400;opacity:.7;">— Sell &amp; manage products</span>
      </button>
    </div>

    <p class="already">Already have an account? <a href="login.html">Log in</a></p>
  </div>

</body>
</html>
