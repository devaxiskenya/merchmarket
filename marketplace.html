<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketplace — MerchMarket</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="merchmarket.css">
</head>
<body class="body">

  <nav>
    <div class="logo" onclick="location.href='index.html'">MerchMarket</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="marketplace.html" class="active">Marketplace</a>
      <a href="wishlist.html" style="position:relative;">
        ♡ Wishlist
        <span class="wishlist-count" id="wishlist-count" style="display:none;position:absolute;top:-8px;right:-10px;background:#c47d2e;color:#000;border-radius:50%;min-width:18px;height:18px;font-size:.7rem;font-weight:700;padding:0 4px;display:none;align-items:center;justify-content:center;">0</span>
      </a>
      <a href="login.html" class="btn btn-primary" style="font-size:.85rem;padding:.55rem 1.1rem;" data-auth-link="login">Log In</a>
      <a href="#" class="btn btn-primary" style="font-size:.85rem;padding:.55rem 1.1rem;display:none;" data-auth-link="logout">Sign Out</a>
    </div>
  </nav>

  <div class="marketplace-container">
    <div class="marketplace-header">
      <h1>Discover Unique Merch from thriftshops and world wide</h1>
      <div class="search-bar" style="display:flex;gap:0.8rem;flex:1;max-width:700px;">
        <input type="text" id="searchInput" class="search-input" placeholder="Search products, brands, tags…" oninput="searchProducts()">
        <button class="search-btn" onclick="searchProducts()">Search</button>
      </div>
    </div>

    <!-- Filter Tabs: Wear Type + Item Type -->
    <div style="margin-top:-1rem; margin-bottom:1.2rem;">
      <div class="filter-tabs" id="marketplaceWearTabs" aria-label="Wear type filters" style="margin-bottom:0.9rem;">
        <button class="filter-tab active" type="button" onclick="setWearFilter('all')">All</button>
        <button class="filter-tab" type="button" onclick="setWearFilter('official')">Official Wear</button>
        <button class="filter-tab" type="button" onclick="setWearFilter('street')">Street Wear</button>
        <button class="filter-tab" type="button" onclick="setWearFilter('casual')">Casual Wear</button>
      </div>

      <div class="filter-tabs" id="marketplaceItemTabs" aria-label="Item type filters">
        <button class="filter-tab active" type="button" onclick="setItemFilter('all')">All</button>
        <button class="filter-tab" type="button" onclick="setItemFilter('torso')">Torso</button>
        <button class="filter-tab" type="button" onclick="setItemFilter('trunks')">Trunks</button>
        <button class="filter-tab" type="button" onclick="setItemFilter('innies')">Innies</button>
        <button class="filter-tab" type="button" onclick="setItemFilter('shoes')">Shoes</button>
        <button class="filter-tab" type="button" onclick="setItemFilter('socks')">Socks</button>
      </div>
    </div>

    <div class="results-header">
      <div class="results-count">Showing <strong>0</strong> results</div>
    </div>

    <!-- Product Grid — JS will manage this once initMarketplace() runs -->
    <div class="product-grid" id="productGrid">
      <!-- Rendered by merchmarket.js initMarketplace() -->
    </div>
  </div>
<script src="merchmarket.js"></script>

</body>
</html>
